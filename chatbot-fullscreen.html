<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sarathi AI Labs — Enterprise AI Concierge Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sarathi-primary: #2563EB;
      --sarathi-primary-hover: #1D4ED8;
      --sarathi-primary-active: #1E40AF;
      --sarathi-primary-subtle: #EFF6FF;
      --sarathi-primary-tint: #DBEAFE;
      --sarathi-primary-glow: rgba(37, 99, 235, 0.35);
      
      --sarathi-bg-app: #F8FAFC;
      --sarathi-bg-sidebar: #FFFFFF;
      --sarathi-bg-header: #FFFFFF;
      --sarathi-bg-card: #FFFFFF;
      --sarathi-bg-input: #FFFFFF;
      --sarathi-bg-code: #0F172A;
      
      --sarathi-border: #E2E8F0;
      --sarathi-border-hover: #BFDBFE;
      
      --sarathi-text-main: #0F172A;
      --sarathi-text-secondary: #334155;
      --sarathi-text-muted: #64748B;
      --sarathi-text-subtle: #94A3B8;
      
      --sarathi-emerald: #10B981;
      --sarathi-radius-sm: 8px;
      --sarathi-radius-md: 12px;
      --sarathi-radius-lg: 16px;
      --sarathi-radius-xl: 24px;
      --sarathi-radius-full: 9999px;
      
      --sarathi-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --sarathi-shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
      --sarathi-shadow-lg: 0 20px 48px -6px rgba(15, 23, 42, 0.12);
      
      --sarathi-font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --sarathi-font-mono: 'JetBrains Mono', monospace;
    }

    html[data-theme="dark"] {
      --sarathi-primary: #3B82F6;
      --sarathi-primary-hover: #60A5FA;
      --sarathi-primary-active: #2563EB;
      --sarathi-primary-subtle: rgba(59, 130, 246, 0.14);
      --sarathi-primary-tint: rgba(59, 130, 246, 0.25);
      --sarathi-primary-glow: rgba(59, 130, 246, 0.45);
      
      --sarathi-bg-app: #090E1A;
      --sarathi-bg-sidebar: #0F172A;
      --sarathi-bg-header: #0F172A;
      --sarathi-bg-card: #1E293B;
      --sarathi-bg-input: #1E293B;
      --sarathi-bg-code: #030712;
      
      --sarathi-border: rgba(148, 163, 184, 0.18);
      --sarathi-border-hover: rgba(59, 130, 246, 0.4);
      
      --sarathi-text-main: #F8FAFC;
      --sarathi-text-secondary: #CBD5E1;
      --sarathi-text-muted: #94A3B8;
      --sarathi-text-subtle: #64748B;
      
      --sarathi-shadow-md: 0 10px 30px rgba(0, 0, 0, 0.5);
      --sarathi-shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-family: var(--sarathi-font-sans);
      background-color: var(--sarathi-bg-app);
      color: var(--sarathi-text-main);
      -webkit-font-smoothing: antialiased;
    }

    .fullscreen-app {
      display: flex;
      height: 100%;
      height: 100dvh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }

    /* ==========================================================================
       SIDEBAR & MOBILE DRAWER
       ========================================================================== */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar {
      width: 290px;
      background: var(--sarathi-bg-sidebar);
      border-right: 1px solid var(--sarathi-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px 24px;
      flex-shrink: 0;
      z-index: 100;
      overflow-y: auto;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .sidebar-brand-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px;
      text-decoration: none;
    }

    .sidebar-avatar {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .sidebar-avatar svg {
      width: 24px;
      height: 24px;
    }

    .sidebar-brand h2 {
      font-size: 15px;
      font-weight: 800;
      color: var(--sarathi-text-main);
      margin: 0;
      line-height: 1.2;
    }

    .sidebar-brand p {
      font-size: 11px;
      color: var(--sarathi-text-muted);
      margin: 0;
      font-weight: 500;
    }

    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--sarathi-border);
      border-radius: var(--sarathi-radius-sm);
      color: var(--sarathi-text-muted);
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-new-chat {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      background: var(--sarathi-primary);
      color: #FFFFFF;
      border: none;
      border-radius: var(--sarathi-radius-md);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
    }

    .btn-new-chat:hover {
      background: var(--sarathi-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--sarathi-text-subtle);
      letter-spacing: 0.05em;
      padding: 0 8px;
      margin-bottom: 8px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .topic-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--sarathi-radius-md);
      font-size: 13px;
      font-weight: 600;
      color: var(--sarathi-text-secondary);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .topic-btn:hover {
      background: var(--sarathi-primary-subtle);
      color: var(--sarathi-primary);
      border-color: var(--sarathi-border-hover);
    }

    .topic-btn .icon {
      font-size: 16px;
      line-height: 1;
    }

    .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--sarathi-border);
      padding-top: 16px;
      margin-top: 20px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: var(--sarathi-radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--sarathi-text-muted);
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .sidebar-link:hover {
      background: var(--sarathi-primary-subtle);
      color: var(--sarathi-primary);
    }

    .sidebar-link.danger {
      color: #EF4444;
    }

    .sidebar-link.danger:hover {
      background: #FEE2E2;
      color: #DC2626;
    }

    /* ==========================================================================
       MAIN CHAT PANE
       ========================================================================== */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      background: var(--sarathi-bg-app);
      position: relative;
      overflow: hidden;
    }

    .chat-header {
      padding: 12px 24px;
      background: var(--sarathi-bg-header);
      border-bottom: 1px solid var(--sarathi-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
      min-height: 58px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--sarathi-bg-card);
      border: 1px solid var(--sarathi-border);
      border-radius: var(--sarathi-radius-sm);
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--sarathi-text-main);
      padding: 0;
      flex-shrink: 0;
    }

    .mobile-menu-btn svg {
      width: 18px;
      height: 18px;
    }

    .header-title-wrap h1 {
      font-size: 15px;
      font-weight: 800;
      color: var(--sarathi-text-main);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--sarathi-emerald);
      background: #ECFDF5;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid #A7F3D0;
    }

    html[data-theme="dark"] .live-badge {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(52, 211, 153, 0.3);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--sarathi-emerald);
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      background: var(--sarathi-bg-card);
      border: 1px solid var(--sarathi-border);
      border-radius: var(--sarathi-radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--sarathi-text-secondary);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: var(--sarathi-primary-subtle);
      border-color: var(--sarathi-border-hover);
      color: var(--sarathi-primary);
    }

    .header-btn.exit-btn {
      font-weight: 700;
    }

    /* Scroll Area & Messages */
    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 20px 32px;
      display: flex;
      justify-content: center;
      -webkit-overflow-scrolling: touch;
    }

    .chat-max-width {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sarathi-message {
      display: flex;
      gap: 12px;
      max-width: 90%;
      animation: msgFadeIn 0.25s ease forwards;
    }

    .sarathi-message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
      max-width: 84%;
    }

    .sarathi-message.assistant {
      align-self: flex-start;
      max-width: 92%;
    }

    .sarathi-msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .sarathi-msg-avatar svg {
      width: 22px;
      height: 22px;
    }

    .sarathi-msg-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 100%;
    }

    .sarathi-msg-bubble {
      padding: 14px 18px;
      font-size: 14px;
      line-height: 1.6;
      border-radius: var(--sarathi-radius-lg);
      word-break: break-word;
    }

    .sarathi-message.user .sarathi-msg-bubble {
      background: #0a2540;
      color: #FFFFFF;
      font-weight: 500;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 4px 14px rgba(10, 37, 64, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 18px;
    }

    html[data-theme="dark"] .sarathi-message.user .sarathi-msg-bubble {
      background: #1D4ED8;
      box-shadow: 0 4px 16px rgba(29, 78, 216, 0.35);
    }

    .sarathi-message.assistant .sarathi-msg-bubble {
      background: var(--sarathi-bg-card);
      color: var(--sarathi-text-main);
      border: 1px solid var(--sarathi-border);
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 4px 20px -3px rgba(15, 23, 42, 0.06);
      padding: 16px 20px;
    }

    .sarathi-msg-time {
      font-size: 11px;
      color: var(--sarathi-text-subtle);
      font-weight: 500;
      padding: 0 4px;
    }

    .sarathi-message.user .sarathi-msg-time {
      text-align: right;
    }

    /* Feature Cards inside Fullscreen */
    .sarathi-feature-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 12px 0;
    }

    .sarathi-feature-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(248, 250, 252, 0.9);
      border: 1px solid var(--sarathi-border);
      border-radius: 12px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="dark"] .sarathi-feature-card {
      background: rgba(15, 23, 42, 0.55);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .sarathi-feature-card:hover {
      transform: translateX(3px) translateY(-1px);
      background: var(--sarathi-bg-card);
      border-color: rgba(37, 99, 235, 0.35);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.09);
    }

    .sarathi-feature-icon-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(37, 99, 235, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      line-height: 1;
    }

    .sarathi-feature-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sarathi-feature-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--sarathi-text-main);
      letter-spacing: -0.01em;
    }

    .sarathi-feature-desc {
      font-size: 12.5px;
      color: var(--sarathi-text-muted);
      line-height: 1.45;
    }

    .sarathi-md-prompt {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(37, 99, 235, 0.06);
      border-left: 3.5px solid var(--sarathi-primary);
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--sarathi-text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Markdown styling */
    .sarathi-msg-bubble h1,
    .sarathi-msg-bubble h2,
    .sarathi-msg-bubble h3 {
      color: var(--sarathi-text-main);
      margin: 8px 0 6px 0;
      line-height: 1.35;
    }

    .sarathi-msg-bubble h3 { font-size: 15px; font-weight: 700; }
    .sarathi-msg-bubble h2 { font-size: 17px; font-weight: 800; }
    .sarathi-msg-bubble h1 { font-size: 19px; font-weight: 800; }

    .sarathi-msg-bubble p {
      margin: 0 0 8px 0;
    }
    .sarathi-msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .sarathi-msg-bubble ul,
    .sarathi-msg-bubble ol {
      margin: 6px 0 10px 20px;
    }

    .sarathi-msg-bubble li {
      margin-bottom: 4px;
    }

    .sarathi-msg-bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 12.5px;
    }

    .sarathi-msg-bubble th {
      background: var(--sarathi-primary-subtle);
      color: var(--sarathi-primary);
      text-align: left;
      padding: 8px 12px;
      border: 1px solid var(--sarathi-border);
      font-weight: 700;
    }

    .sarathi-msg-bubble td {
      padding: 8px 12px;
      border: 1px solid var(--sarathi-border);
    }

    .sarathi-code-box {
      background: var(--sarathi-bg-code);
      border-radius: var(--sarathi-radius-md);
      margin: 10px 0;
      overflow: hidden;
    }

    .sarathi-code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--sarathi-font-mono);
      font-size: 11px;
      color: #94A3B8;
    }

    .sarathi-code-box pre {
      margin: 0;
      padding: 12px 14px;
      overflow-x: auto;
      font-family: var(--sarathi-font-mono);
      font-size: 12.5px;
      color: #E2E8F0;
    }

    /* Quick Reply Buttons matching Reference UI */
    .sarathi-quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .sarathi-quick-btn {
      border-radius: 9999px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      user-select: none;
      font-family: inherit;
      white-space: nowrap;
    }

    .sarathi-quick-btn.btn-primary {
      background: #0a2540;
      color: #FFFFFF;
      border: 1.5px solid #0a2540;
    }

    .sarathi-quick-btn.btn-primary:hover {
      background: #11365b;
      border-color: #11365b;
      color: #FFFFFF;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px rgba(10, 37, 64, 0.25);
    }

    .sarathi-quick-btn.btn-outline {
      background: #FFFFFF;
      color: #1e60d5;
      border: 1.5px solid #2563EB;
    }

    .sarathi-quick-btn.btn-outline:hover {
      background: #EFF6FF;
      border-color: #1D4ED8;
      color: #1D4ED8;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.16);
    }

    html[data-theme="dark"] .sarathi-quick-btn.btn-primary {
      background: #3B82F6;
      border-color: #3B82F6;
      color: #FFFFFF;
    }

    html[data-theme="dark"] .sarathi-quick-btn.btn-outline {
      background: #1E293B;
      color: #93C5FD;
      border-color: #60A5FA;
    }

    /* Flow Chips */
    .sarathi-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .sarathi-chip-btn {
      background: var(--sarathi-bg-card);
      border: 1px solid var(--sarathi-border-hover);
      color: var(--sarathi-primary);
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--sarathi-radius-full);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }

    .sarathi-chip-btn:hover {
      background: #0a2540;
      border-color: #0a2540;
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(10, 37, 64, 0.25);
    }

    /* Sources Cards */
    .sarathi-sources-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--sarathi-border);
    }

    .sarathi-source-card {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--sarathi-primary-subtle);
      border: 1px solid var(--sarathi-border-hover);
      padding: 4px 10px;
      border-radius: var(--sarathi-radius-sm);
      font-size: 12px;
      font-weight: 600;
      color: var(--sarathi-primary);
      text-decoration: none;
      transition: all 0.2s;
    }

    .sarathi-source-card:hover {
      background: var(--sarathi-primary);
      color: #FFFFFF;
    }

    /* ==========================================================================
       COMPOSER & GLOWING ALWAYS-VISIBLE SEND BUTTON
       ========================================================================== */
    .composer-area {
      background: var(--sarathi-bg-header);
      border-top: 1px solid var(--sarathi-border);
      padding: 14px 24px max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      z-index: 20;
    }

    .composer-inner {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .composer-bar {
      display: flex;
      align-items: center;
      background: var(--sarathi-bg-app);
      border: 1.5px solid var(--sarathi-border);
      border-radius: 28px;
      padding: 6px 8px 6px 18px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      gap: 8px;
    }

    .composer-bar:focus-within {
      border-color: var(--sarathi-primary);
      background: var(--sarathi-bg-card);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .composer-textarea {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      resize: none;
      font-family: var(--sarathi-font-sans);
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--sarathi-text-main);
      max-height: 100px;
      padding: 6px 0;
      box-sizing: border-box;
    }

    .composer-textarea::placeholder {
      color: var(--sarathi-text-subtle);
    }

    /* VIBRANT & PROMINENT SEND BUTTON */
    .send-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF !important;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
      position: relative;
    }

    .send-btn svg {
      width: 17px;
      height: 17px;
      stroke: #FFFFFF;
      stroke-width: 2.4;
      transition: transform 0.2s ease;
      margin-left: -1px;
    }

    .send-btn:hover {
      background: linear-gradient(135deg, #1D4ED8 0%, #1E40AF 100%);
      transform: scale(1.08);
      box-shadow: 0 5px 16px rgba(37, 99, 235, 0.45);
    }

    .send-btn:hover svg {
      transform: translateX(1.5px) translateY(-1.5px);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn.empty-state {
      opacity: 0.85;
    }

    .composer-footer-text {
      font-size: 11px;
      color: var(--sarathi-text-subtle);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    /* Typing Indicator */
    .typing-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--sarathi-bg-card);
      border: 1px solid var(--sarathi-border);
      border-radius: var(--sarathi-radius-full);
      font-size: 12px;
      color: var(--sarathi-text-muted);
      box-shadow: var(--sarathi-shadow-sm);
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--sarathi-primary);
      border-radius: 50%;
      animation: dotBounce 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       RESPONSIVE DESIGN (MOBILE & TABLET)
       ========================================================================== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        height: 100dvh;
        transform: translateX(-100%);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);

        min-width: 38px;
        min-height: 38px;
      }

      .composer-footer-text {
        font-size: 10px;
      }
    }
  </style>

  <script>
    (function () {
      const STORAGE_KEY = 'sarathi_ai_chat_history';
      const STORAGE_LEAD = 'sarathi_ai_lead_info';
      const STORAGE_THEME = 'sarathi_ai_theme';
      const API_ENDPOINT = window.SARATHI_CHATBOT_API || 'https://n8n.srv1178467.hstgr.cloud/webhook/sal-ai-chat';
      
      const scrollArea = document.getElementById('fs-scroll-area');
      const messagesContainer = document.getElementById('fs-messages-container');
      const textarea = document.getElementById('fs-textarea');
      const btnSend = document.getElementById('fs-btn-send');
      const btnClear = document.getElementById('fs-btn-clear');
      const btnNew = document.getElementById('fs-btn-new');
      const btnTheme = document.getElementById('fs-btn-theme');
      const headerThemeBtn = document.getElementById('fs-header-theme-btn');
      const headerNewBtn = document.getElementById('fs-header-new-btn');
      const typingWrap = document.getElementById('fs-typing-wrap');

      // Mobile Drawer Elements
      const mobileMenuBtn = document.getElementById('fs-mobile-menu-btn');
      const sidebar = document.getElementById('fs-sidebar');
      const sidebarOverlay = document.getElementById('fs-sidebar-overlay');
      const sidebarClose = document.getElementById('fs-sidebar-close');

      function toggleMobileDrawer(open) {
        if (open) {
          sidebar.classList.add('open');
          sidebarOverlay.classList.add('active');
        } else {
          sidebar.classList.remove('open');
          sidebarOverlay.classList.remove('active');
        }
      }

      if (mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', () => toggleMobileDrawer(true));
      }
      if (sidebarOverlay) {
        sidebarOverlay.addEventListener('click', () => toggleMobileDrawer(false));
      }
      if (sidebarClose) {
        sidebarClose.addEventListener('click', () => toggleMobileDrawer(false));
      }

      // Theme toggle
      function toggleTheme() {
        const curr = document.documentElement.getAttribute('data-theme') || 'light';
        const next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(STORAGE_THEME, next);
      }

      const savedTheme = localStorage.getItem(STORAGE_THEME) || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      if (btnTheme) btnTheme.addEventListener('click', toggleTheme);
      if (headerThemeBtn) headerThemeBtn.addEventListener('click', toggleTheme);

      function getChatHistory() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        } catch (e) {
          return [];
        }
      }

      function saveChatHistory(history) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      }

      function getLeadInfo() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_LEAD) || '{}');
        } catch (e) {
          return {};
        }
      }

      function renderMarkdown(text) {
        if (!text) return '';
        let raw = text.replace(/\r\n/g, '\n');
        let html = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        
        // Code block
        html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function (match, lang, code) {
          return `
            <div class="sarathi-code-box">
              <div class="sarathi-code-header">
                <span>${(lang || 'CODE').toUpperCase()}</span>
              </div>
              <pre><code>${code.trim()}</code></pre>
            </div>
          `;
        });

        html = html.replace(/`([^`]+)`/g, '<code style="font-family: monospace; background: var(--sarathi-primary-subtle); color: var(--sarathi-primary); padding: 2px 6px; border-radius: 4px;">$1</code>');
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        
        // Tables
        html = html.replace(/((?:\|.+?\|\n?)+)/g, function (tableMatch) {
          const rows = tableMatch.trim().split('\n');
          if (rows.length < 2) return tableMatch;
          let tableHtml = '<table>';
          rows.forEach((row, index) => {
            if (row.match(/^\|?\s*:?-+:?\s*\|/)) return;
            const cols = row.split('|').filter((c, i, arr) => i > 0 && i < arr.length - 1);
            if (cols.length === 0) return;
            tableHtml += '<tr>';
            cols.forEach(col => {
              const tag = index === 0 ? 'th' : 'td';
              tableHtml += `<${tag}>${col.trim()}</${tag}>`;
            });
            tableHtml += '</tr>';
          });
          tableHtml += '</table>';
          return tableHtml;
        });

        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: var(--sarathi-primary); font-weight: 600;">$1 ↗</a>');

        const lines = html.split('\n');
        let out = [];
        let featureBuffer = [];
        let listBuffer = [];

        function flushFeatures() {
          if (featureBuffer.length === 0) return;
          let fHtml = '<div class="sarathi-feature-list">';
          featureBuffer.forEach((f) => {
            fHtml += `
              <div class="sarathi-feature-card">
                <div class="sarathi-feature-icon-box">${f.icon}</div>
                <div class="sarathi-feature-body">
                  <span class="sarathi-feature-title">${f.title}</span>
                  ${f.desc ? `<span class="sarathi-feature-desc">${f.desc}</span>` : ''}
                </div>
              </div>
            `;
          });
          fHtml += '</div>';
          out.push(fHtml);
          featureBuffer = [];
        }

        function flushList() {
          if (listBuffer.length === 0) return;
          let lHtml = '<ul style="margin: 6px 0 10px 20px;">';
          listBuffer.forEach(li => {
            lHtml += `<li>${li}</li>`;
          });
          lHtml += '</ul>';
          out.push(lHtml);
          listBuffer = [];
        }

        const emojiRegex = /^([\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E0}-\u{1F1FF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}])\s*/u;

        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) {
            flushFeatures();
            flushList();
            return;
          }

          if (trimmed.startsWith('<div class="sarathi-code') || trimmed.startsWith('<table>') || trimmed.startsWith('<h')) {
            flushFeatures();
            flushList();
            out.push(trimmed);
            return;
          }

          const emojiMatch = trimmed.match(emojiRegex);
          const bulletMatch = trimmed.match(/^[-*•]\s+/);

          let isFeatureItem = false;
          let itemIcon = '✦';
          let itemTitle = '';
          let itemDesc = '';

          if (emojiMatch) {
            itemIcon = emojiMatch[1];
            const rest = trimmed.substring(emojiMatch[0].length).trim();
            const strongMatch = rest.match(/^(?:<strong>([^<]+)<\/strong>|\*\*([^*]+)\*\*)\s*(?:[–—:-]\s*|\s*:\s*|\s*-\s*)(.*)$/);
            const plainMatch = rest.match(/^([A-Za-z0-9\s&/]{2,40})\s*(?:[–—:-]\s*|\s*:\s*|\s*-\s*)(.*)$/);
            if (strongMatch) {
              itemTitle = strongMatch[1] || strongMatch[2];
              itemDesc = strongMatch[3];
              isFeatureItem = true;
            } else if (plainMatch) {
              itemTitle = plainMatch[1];
              itemDesc = plainMatch[2];
              isFeatureItem = true;
            } else {
              itemTitle = rest;
              itemDesc = '';
              isFeatureItem = true;
            }
          } else if (bulletMatch) {
            const rest = trimmed.substring(bulletMatch[0].length).trim();
            const strongMatch = rest.match(/^(?:<strong>([^<]+)<\/strong>|\*\*([^*]+)\*\*)\s*(?:[–—:-]\s*|\s*:\s*|\s*-\s*)(.*)$/);
            if (strongMatch) {
              itemIcon = '🔹';
              itemTitle = strongMatch[1] || strongMatch[2];
              itemDesc = strongMatch[3];
              isFeatureItem = true;
            }
          }

          if (isFeatureItem) {
            flushList();
            featureBuffer.push({ icon: itemIcon, title: itemTitle, desc: itemDesc });
            return;
          }

          if (bulletMatch) {
            flushFeatures();
            listBuffer.push(trimmed.substring(bulletMatch[0].length).trim());
            return;
          }

          flushFeatures();
          flushList();

          const isClosing = trimmed.endsWith('?') && (trimmed.startsWith('What') || trimmed.startsWith('How') || trimmed.startsWith('Would you') || trimmed.startsWith('Which'));
          if (isClosing) {
            out.push(`<div class="sarathi-md-prompt"><span>${trimmed}</span></div>`);
          } else {
            out.push(`<p>${trimmed}</p>`);
          }
        });

        flushFeatures();
        flushList();
        return out.join('');
      }

      function renderMessages() {
        const history = getChatHistory();
        messagesContainer.innerHTML = '';

        if (history.length === 0) {
          const lead = getLeadInfo();
          const name = lead && lead.name ? lead.name.split(' ')[0] : 'there';
          messagesContainer.innerHTML = `
            <div style="text-align: center; padding: 40px 16px 20px;">
              <div class="sidebar-avatar" style="width: 58px; height: 58px; margin: 0 auto 16px; font-size: 26px;">
                🤖
              </div>
              <h2 style="font-size: 22px; font-weight: 800; color: var(--sarathi-text-main); margin-bottom: 8px;">Hi <span style="background: linear-gradient(135deg, #2563EB 0%, #7C3AED 50%, #06B6D4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${name}</span> 👋</h2>
              <p style="font-size: 14px; color: var(--sarathi-text-muted); max-width: 500px; margin: 0 auto 24px;">How can we empower you with intelligent technology today?</p>
              
              <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 640px; margin: 0 auto;">
                <button class="sarathi-chip-btn" onclick="sendMessage('Tell me about Sarathi Agentic AI and Custom Solutions')">🤖 Agentic AI Swarms</button>
                <button class="sarathi-chip-btn" onclick="sendMessage('What Web Development & Cloud services do you provide?')">💻 Full-Stack Systems</button>
                <button class="sarathi-chip-btn" onclick="sendMessage('How does Sarathi AI help with Test Automation and QA frameworks?')">⚡ Test Automation QA</button>
                <button class="sarathi-chip-btn" onclick="sendMessage('What Professional Courses and Training programs do you offer?')">🎓 Professional Courses</button>
              </div>
            </div>
          `;
          return;
        }

        history.forEach((msg, idx) => {
          const isBot = msg.sender === 'assistant';
          const msgEl = document.createElement('div');
          msgEl.className = `sarathi-message ${isBot ? 'assistant' : 'user'}`;

          let sourcesHtml = '';
          if (msg.sources && msg.sources.length > 0) {
            sourcesHtml = `<div class="sarathi-sources-list">`;
            msg.sources.forEach(src => {
              sourcesHtml += `
                <a class="sarathi-source-card" href="${src.url}" target="_blank">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                  </svg>
                  <span>${src.title}</span>
                </a>
              `;
            });
            sourcesHtml += `</div>`;
          }

          msgEl.innerHTML = `
            ${isBot ? `
              <div class="sarathi-msg-avatar">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="50" cy="17" r="5" fill="#38BDF8"/>
                  <rect x="47.5" y="21" width="5" height="7" rx="2.5" fill="#FFFFFF"/>
                  <rect x="18" y="44" width="7" height="18" rx="3.5" fill="#FFFFFF"/>
                  <rect x="75" y="44" width="7" height="18" rx="3.5" fill="#FFFFFF"/>
                  <rect x="23" y="27" width="54" height="49" rx="19" fill="#FFFFFF"/>
                  <rect x="29" y="33" width="42" height="37" rx="13" fill="#0F172A"/>
                  <circle cx="41.5" cy="49" r="4.5" fill="#38BDF8"/>
                  <circle cx="58.5" cy="49" r="4.5" fill="#38BDF8"/>
                  <path d="M 44.5 56.5 Q 50 62 55.5 56.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                </svg>
              </div>
            ` : ''}
            <div class="sarathi-msg-body">
              <div class="sarathi-msg-bubble">
                <div class="sarathi-markdown">${isBot ? renderMarkdown(msg.text) : escapeHtml(msg.text)}</div>
                ${sourcesHtml}
              </div>
              <div class="sarathi-msg-time">${msg.time}</div>
            </div>
          `;

          msgEl.querySelectorAll('.sarathi-chip-btn').forEach(btn => {
            btn.addEventListener('click', () => sendMessage(btn.textContent.trim()));
          });

          messagesContainer.appendChild(msgEl);
        });

        scrollToLatest(true);
      }

      function scrollToLatest(smooth = false) {
        setTimeout(() => {
          if (scrollArea) {
            scrollArea.scrollTo({
              top: scrollArea.scrollHeight,
              behavior: smooth ? 'smooth' : 'auto'
            });
          }
        }, 50);
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      // Intelligent Fallback Knowledge
      function generateFallbackResponse(query) {

      window.sendMessage = async function (userText) {
        if (!userText || !userText.trim()) {
          textarea.focus();
          return;
        }
        userText = userText.trim();
        const history = getChatHistory();
        history.push({
          id: 'msg_' + Date.now(),
          sender: 'user',
          text: userText,
          time: formatTime(new Date())
        });
        saveChatHistory(history);
        renderMessages();

        typingWrap.style.display = 'block';
        scrollToLatest(true);

        let aiResult = null;
        try {
          if (API_ENDPOINT) {
            const lead = getLeadInfo();
            const payload = {
              message: userText,
              visitor_id: localStorage.getItem('sarathi_ai_visitor_id') || 'vid_fullscreen',
              conversation_id: localStorage.getItem('sarathi_ai_conv_id') || 'conv_fullscreen',
              name: lead.name || '',
              phone: lead.phone || lead.contact || '',
              contact: lead.phone || lead.contact || '',
              page_url: window.location.href,
              page_title: document.title,
              timestamp: new Date().toISOString()
            };

            const response = await fetch(API_ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (response.ok) {
              const contentType = response.headers.get('content-type') || '';
              let data;
              if (contentType.includes('application/json')) {
                data = await response.json();
              } else {
                const rawText = await response.text();
                try {
                  data = JSON.parse(rawText);
                } catch {
                  data = { text: rawText };
                }
              }

              const item = Array.isArray(data) ? data[0] : data;
              let textContent = '';
              if (typeof item === 'string') {
                textContent = item;
              } else if (item && typeof item === 'object') {
                textContent = item.output || item.response || item.answer || item.text || item.message || item.content || '';
                if (!textContent && Object.keys(item).length > 0) {
                  textContent = JSON.stringify(item);
                }
              }

              if (textContent) {
                aiResult = {
                  text: textContent,
                  sources: (item && item.sources) || [],
                  chips: (item && item.chips) || []
                };
              }
            }
          }
        } catch (e) {
          console.warn('[Sarathi AI Fullscreen] Webhook fetch error, using fallback', e);
        }

        if (!aiResult) {
          await new Promise(r => setTimeout(r, 600));
          aiResult = generateFallbackResponse(userText);
        }

        history.push({
          id: 'msg_' + (Date.now() + 1),
          sender: 'assistant',
          text: aiResult.text,
          sources: aiResult.sources || [],
          chips: aiResult.chips || [],
          time: formatTime(new Date())
        });
        saveChatHistory(history);

        typingWrap.style.display = 'none';
        renderMessages();
      };

      function handleUserSend() {
        const val = textarea.value.trim();
        if (val) {
          sendMessage(val);
          textarea.value = '';
          textarea.style.height = 'auto';
        } else {
          textarea.focus();
        }
      }

      // Textarea Auto-expand & Send
      textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
      });

      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleUserSend();
        }
      });

      btnSend.addEventListener('click', handleUserSend);

      if (btnClear) {
        btnClear.addEventListener('click', () => {
          if (confirm('Clear all conversation history?')) {
            saveChatHistory([]);
            renderMessages();
            toggleMobileDrawer(false);
          }
        });
      }

      function startNewChat() {
        saveChatHistory([]);
        renderMessages();
        toggleMobileDrawer(false);
        textarea.focus();
      }

      if (btnNew) btnNew.addEventListener('click', startNewChat);
      if (headerNewBtn) headerNewBtn.addEventListener('click', startNewChat);

      document.querySelectorAll('.topic-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const topic = btn.getAttribute('data-topic');
          toggleMobileDrawer(false);
          sendMessage(`Tell me about ${topic}`);
        });
      });

      // Storage event cross-tab synchronization
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY || e.key === STORAGE_THEME) {
          if (e.key === STORAGE_THEME) {
            document.documentElement.setAttribute('data-theme', localStorage.getItem(STORAGE_THEME) || 'light');
          }
          renderMessages();
        }
      });

      // Initial Render
      renderMessages();
    })();
  </script>
