<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarathi AI Chatbot Widget Preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="./assets/css/sarathi-chatbot.css">
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F1F5F9;
      min-height: 100vh;
    }
    .demo-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>Sarathi AI Concierge — Redesigned Widget Preview</h1>
    <p>This test page previews the new chatbot widget matching the reference design.</p>
    <button id="btn-open-preview" style="padding: 10px 20px; font-weight: 700; background: #0d6efd; color: white; border: none; border-radius: 8px; cursor: pointer;">Open Chatbot Widget</button>
    <button id="btn-demo-lead" style="padding: 10px 20px; font-weight: 700; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 10px;">Quick Test (With Demo Lead)</button>
    <button id="btn-reset-preview" style="padding: 10px 20px; font-weight: 700; background: #64748b; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 10px;">Reset Everything</button>
  </div>

  <script>
    window.SARATHI_CHATBOT_SETTINGS = {
      themeUri: '.',
      chatWebhookUrl: 'https://n8n.srv1178467.hstgr.cloud/webhook/sal-ai-chat',
      leadWebhookUrl: 'https://n8n.srv1178467.hstgr.cloud/webhook/sal-lead-cap'
    };
  </script>
  <script src="./assets/js/sarathi-chatbot.js"></script>
  <script>
    document.getElementById('btn-open-preview').addEventListener('click', function() {
      const launcherBtn = document.getElementById('sarathi-launcher-btn');
      if (launcherBtn) launcherBtn.click();
    });

    document.getElementById('btn-demo-lead').addEventListener('click', function() {
      localStorage.setItem('sarathi_ai_lead_info', JSON.stringify({ name: 'Alex Rivera', contact: 'alex@example.com' }));
      location.reload();
    });

    document.getElementById('btn-reset-preview').addEventListener('click', function() {
      localStorage.removeItem('sarathi_ai_chat_history');
      localStorage.removeItem('sarathi_ai_lead_info');
      localStorage.removeItem('sarathi_ai_conv_id');
      location.reload();
    });
  </script>
</body>
</html>
